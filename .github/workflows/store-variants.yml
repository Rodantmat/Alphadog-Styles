name: store-variants
on:
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.PRINTIFY_TOKEN }}
    steps:
      - name: variants
        run: |
          for bp in 12 77; do
            curl -s -H "Authorization: Bearer $T" "https://api.printify.com/v1/catalog/blueprints/$bp/print_providers/99/variants.json" | python3 -c "import sys,json;d=json.load(sys.stdin)['variants'];print('VAR $bp '+json.dumps(sorted({(v['options'].get('color'),v['options'].get('size')) for v in d})))"
          done
