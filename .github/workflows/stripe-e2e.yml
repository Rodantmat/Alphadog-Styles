name: stripe-e2e
on:
  workflow_dispatch:
    inputs:
      email: {description: "receipt email", required: true}
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - env: { TEST_EMAIL: "${{ inputs.email }}" }
        run: python3 scripts/stripe_e2e.py 2>&1 | tee out_log.txt; true
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -f out/stripe_e2e || true; git commit -qm "stripe e2e shots" || exit 0
          git pull -q --rebase origin main; git push -q origin HEAD:main
    permissions: { contents: write }
