name: printify-neckall
on:
  workflow_dispatch:
    inputs:
      shop: {required: true}
      limit: {default: "100000"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
          SHOP: ${{ inputs.shop }}
          LIMIT: ${{ inputs.limit }}
        run: |
          mkdir -p out
          python3 scripts/printify_neckall.py 2>&1 | tee out/neckall_${{ inputs.shop }}.log
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out/neckall_*.log out/neck_ids.json && git commit -m "neck all" && git pull -q --rebase && git push
