name: tiktok-repurpose
on:
  workflow_dispatch:
    inputs:
      mode: { description: "check|one|all", required: true, default: "check" }
      only: { description: "tiktok id suffix (optional)", required: false, default: "" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
          MODE: ${{ inputs.mode }}
          ONLY: ${{ inputs.only }}
        run: python3 scripts/tiktok_repurpose.py
