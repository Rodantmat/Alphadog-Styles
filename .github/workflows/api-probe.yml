          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_LWA_APP_ID: ${{ secrets.AMAZON_LWA_APP_ID }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          AMAZON_LWA_MARKETPLACE_ID: ${{ secrets.AMAZON_LWA_MARKETPLACE_ID }}
          AMAZON_LWA_REFRESH_TOKEN: ${{ secrets.AMAZON_LWA_REFRESH_TOKEN }}
          AMAZON_LWA_SELLER_ID: ${{ secrets.AMAZON_LWA_SELLER_ID }}
          AMAZON_MARKETPLACE_ID: ${{ secrets.AMAZON_MARKETPLACE_ID }}
          AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
          AMAZON_SELLER_APP_ID: ${{ secrets.AMAZON_SELLER_APP_ID }}
          AMAZON_SELLER_CLIENT_ID: ${{ secrets.AMAZON_SELLER_CLIENT_ID }}
          AMAZON_SELLER_CLIENT_SECRET: ${{ secrets.AMAZON_SELLER_CLIENT_SECRET }}
          AMAZON_SELLER_ID: ${{ secrets.AMAZON_SELLER_ID }}
          AMAZON_SELLER_MARKETPLACE_ID: ${{ secrets.AMAZON_SELLER_MARKETPLACE_ID }}
          AMAZON_SELLER_REFRESH_TOKEN: ${{ secrets.AMAZON_SELLER_REFRESH_TOKEN }}
          AMAZON_SELLER_SELLER_ID: ${{ secrets.AMAZON_SELLER_SELLER_ID }}
          AMAZON_SPAPI_APP_ID: ${{ secrets.AMAZON_SPAPI_APP_ID }}
          AMAZON_SPAPI_CLIENT_ID: ${{ secrets.AMAZON_SPAPI_CLIENT_ID }}
          AMAZON_SPAPI_CLIENT_SECRET: ${{ secrets.AMAZON_SPAPI_CLIENT_SECRET }}
          AMAZON_SPAPI_MARKETPLACE_ID: ${{ secrets.AMAZON_SPAPI_MARKETPLACE_ID }}
          AMAZON_SPAPI_REFRESH_TOKEN: ${{ secrets.AMAZON_SPAPI_REFRESH_TOKEN }}
          AMAZON_SPAPI_SELLER_ID: ${{ secrets.AMAZON_SPAPI_SELLER_ID }}
          AMAZON_SP_API_APP_ID: ${{ secrets.AMAZON_SP_API_APP_ID }}
          AMAZON_SP_API_CLIENT_ID: ${{ secrets.AMAZON_SP_API_CLIENT_ID }}
          AMAZON_SP_API_CLIENT_SECRET: ${{ secrets.AMAZON_SP_API_CLIENT_SECRET }}
          AMAZON_SP_API_LWA_APP_ID: ${{ secrets.AMAZON_SP_API_LWA_APP_ID }}
          AMAZON_SP_API_LWA_CLIENT_ID: ${{ secrets.AMAZON_SP_API_LWA_CLIENT_ID }}
          AMAZON_SP_API_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_SP_API_LWA_CLIENT_SECRET }}
          AMAZON_SP_API_LWA_MARKETPLACE_ID: ${{ secrets.AMAZON_SP_API_LWA_MARKETPLACE_ID }}
          AMAZON_SP_API_LWA_REFRESH_TOKEN: ${{ secrets.AMAZON_SP_API_LWA_REFRESH_TOKEN }}
          AMAZON_SP_API_LWA_SELLER_ID: ${{ secrets.AMAZON_SP_API_LWA_SELLER_ID }}
          AMAZON_SP_API_MARKETPLACE_ID: ${{ secrets.AMAZON_SP_API_MARKETPLACE_ID }}
          AMAZON_SP_API_REFRESH_TOKEN: ${{ secrets.AMAZON_SP_API_REFRESH_TOKEN }}
          AMAZON_SP_API_SELLER_ID: ${{ secrets.AMAZON_SP_API_SELLER_ID }}
          AMAZON_SP_APP_ID: ${{ secrets.AMAZON_SP_APP_ID }}
          AMAZON_SP_CLIENT_ID: ${{ secrets.AMAZON_SP_CLIENT_ID }}
          AMAZON_SP_CLIENT_SECRET: ${{ secrets.AMAZON_SP_CLIENT_SECRET }}
          AMAZON_SP_MARKETPLACE_ID: ${{ secrets.AMAZON_SP_MARKETPLACE_ID }}
          AMAZON_SP_REFRESH_TOKEN: ${{ secrets.AMAZON_SP_REFRESH_TOKEN }}
          AMAZON_SP_SELLER_ID: ${{ secrets.AMAZON_SP_SELLER_ID }}
          AMZN_APP_ID: ${{ secrets.AMZN_APP_ID }}
          AMZN_CLIENT_ID: ${{ secrets.AMZN_CLIENT_ID }}
          AMZN_CLIENT_SECRET: ${{ secrets.AMZN_CLIENT_SECRET }}
          AMZN_MARKETPLACE_ID: ${{ secrets.AMZN_MARKETPLACE_ID }}
          AMZN_REFRESH_TOKEN: ${{ secrets.AMZN_REFRESH_TOKEN }}
          AMZN_SELLER_ID: ${{ secrets.AMZN_SELLER_ID }}
          AMZ_APP_ID: ${{ secrets.AMZ_APP_ID }}
          AMZ_CLIENT_ID: ${{ secrets.AMZ_CLIENT_ID }}
          AMZ_CLIENT_SECRET: ${{ secrets.AMZ_CLIENT_SECRET }}
          AMZ_LWA_APP_ID: ${{ secrets.AMZ_LWA_APP_ID }}
          AMZ_LWA_CLIENT_ID: ${{ secrets.AMZ_LWA_CLIENT_ID }}
          AMZ_LWA_CLIENT_SECRET: ${{ secrets.AMZ_LWA_CLIENT_SECRET }}
          AMZ_LWA_MARKETPLACE_ID: ${{ secrets.AMZ_LWA_MARKETPLACE_ID }}
          AMZ_LWA_REFRESH_TOKEN: ${{ secrets.AMZ_LWA_REFRESH_TOKEN }}
          AMZ_LWA_SELLER_ID: ${{ secrets.AMZ_LWA_SELLER_ID }}
          AMZ_MARKETPLACE_ID: ${{ secrets.AMZ_MARKETPLACE_ID }}
          AMZ_REFRESH_TOKEN: ${{ secrets.AMZ_REFRESH_TOKEN }}
          AMZ_SELLER_ID: ${{ secrets.AMZ_SELLER_ID }}
          AMZ_SP_API_APP_ID: ${{ secrets.AMZ_SP_API_APP_ID }}
          AMZ_SP_API_CLIENT_ID: ${{ secrets.AMZ_SP_API_CLIENT_ID }}
          AMZ_SP_API_CLIENT_SECRET: ${{ secrets.AMZ_SP_API_CLIENT_SECRET }}
          AMZ_SP_API_MARKETPLACE_ID: ${{ secrets.AMZ_SP_API_MARKETPLACE_ID }}
          AMZ_SP_API_REFRESH_TOKEN: ${{ secrets.AMZ_SP_API_REFRESH_TOKEN }}
          AMZ_SP_API_SELLER_ID: ${{ secrets.AMZ_SP_API_SELLER_ID }}
          LWA_APP_ID: ${{ secrets.LWA_APP_ID }}
          LWA_CLIENT_ID: ${{ secrets.LWA_CLIENT_ID }}
          LWA_CLIENT_SECRET: ${{ secrets.LWA_CLIENT_SECRET }}
          LWA_MARKETPLACE_ID: ${{ secrets.LWA_MARKETPLACE_ID }}
          LWA_REFRESH_TOKEN: ${{ secrets.LWA_REFRESH_TOKEN }}
          LWA_SELLER_ID: ${{ secrets.LWA_SELLER_ID }}
          SELLER_API_APP_ID: ${{ secrets.SELLER_API_APP_ID }}
          SELLER_API_CLIENT_ID: ${{ secrets.SELLER_API_CLIENT_ID }}
          SELLER_API_CLIENT_SECRET: ${{ secrets.SELLER_API_CLIENT_SECRET }}
          SELLER_API_MARKETPLACE_ID: ${{ secrets.SELLER_API_MARKETPLACE_ID }}
          SELLER_API_REFRESH_TOKEN: ${{ secrets.SELLER_API_REFRESH_TOKEN }}
          SELLER_API_SELLER_ID: ${{ secrets.SELLER_API_SELLER_ID }}
          SPAPI_APP_ID: ${{ secrets.SPAPI_APP_ID }}
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SPAPI_LWA_APP_ID: ${{ secrets.SPAPI_LWA_APP_ID }}
          SPAPI_LWA_CLIENT_ID: ${{ secrets.SPAPI_LWA_CLIENT_ID }}
          SPAPI_LWA_CLIENT_SECRET: ${{ secrets.SPAPI_LWA_CLIENT_SECRET }}
          SPAPI_LWA_MARKETPLACE_ID: ${{ secrets.SPAPI_LWA_MARKETPLACE_ID }}
          SPAPI_LWA_REFRESH_TOKEN: ${{ secrets.SPAPI_LWA_REFRESH_TOKEN }}
          SPAPI_LWA_SELLER_ID: ${{ secrets.SPAPI_LWA_SELLER_ID }}
          SPAPI_MARKETPLACE_ID: ${{ secrets.SPAPI_MARKETPLACE_ID }}
          SPAPI_REFRESH_TOKEN: ${{ secrets.SPAPI_REFRESH_TOKEN }}
          SPAPI_SELLER_ID: ${{ secrets.SPAPI_SELLER_ID }}
          SP_API_APP_ID: ${{ secrets.SP_API_APP_ID }}
          SP_API_CLIENT_ID: ${{ secrets.SP_API_CLIENT_ID }}
          SP_API_CLIENT_SECRET: ${{ secrets.SP_API_CLIENT_SECRET }}
          SP_API_LWA_APP_ID: ${{ secrets.SP_API_LWA_APP_ID }}
          SP_API_LWA_CLIENT_ID: ${{ secrets.SP_API_LWA_CLIENT_ID }}
          SP_API_LWA_CLIENT_SECRET: ${{ secrets.SP_API_LWA_CLIENT_SECRET }}
          SP_API_LWA_MARKETPLACE_ID: ${{ secrets.SP_API_LWA_MARKETPLACE_ID }}
          SP_API_LWA_REFRESH_TOKEN: ${{ secrets.SP_API_LWA_REFRESH_TOKEN }}
          SP_API_LWA_SELLER_ID: ${{ secrets.SP_API_LWA_SELLER_ID }}
          SP_API_MARKETPLACE_ID: ${{ secrets.SP_API_MARKETPLACE_ID }}
          SP_API_REFRESH_TOKEN: ${{ secrets.SP_API_REFRESH_TOKEN }}
          SP_API_SELLER_ID: ${{ secrets.SP_API_SELLER_ID }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.parse, re
          S = {k: v for k, v in os.environ.items() if v and re.search(r"EBAY|AMAZON|AMZ|SP_?API|LWA|SELLER", k)}
          def req(url, data=None, headers=None, method=None):
              r = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=40) as f:
                      return f.status, f.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()
          def pick(*names):
              for n in names:
                  if S.get(n): return n, S[n]
              return None, None

          print("== Secret names present (names only) ==")
          print(", ".join(sorted(k for k in S if re.search(r"EBAY|AMAZON|SP_?API|LWA|SELLER|AWS", k))))

          # ---------------- eBay ----------------
          print("\n== eBay ==")
          try:
              auth = base64.b64encode(f"{S['EBAY_CLIENT_ID']}:{S['EBAY_CLIENT_SECRET']}".encode()).decode()
              scopes = " ".join("https://api.ebay.com/oauth/api_scope" + s for s in
                  ["", "/sell.inventory.readonly", "/sell.account.readonly", "/commerce.identity.readonly", "/sell.fulfillment.readonly"])
              st, body = req("https://api.ebay.com/identity/v1/oauth2/token",
                  urllib.parse.urlencode({"grant_type": "refresh_token", "refresh_token": S["EBAY_REFRESH_TOKEN"], "scope": scopes}).encode(),
                  {"Authorization": "Basic " + auth, "Content-Type": "application/x-www-form-urlencoded"})
              tok = json.loads(body).get("access_token")
              print("refresh -> access token:", "OK" if tok else f"FAIL {st} {json.loads(body).get('error_description')}")
              if tok:
                  print(f"::add-mask::{tok}")
                  H = {"Authorization": "Bearer " + tok}
                  st, b = req("https://apiz.ebay.com/commerce/identity/v1/user/", headers=H)
                  print("identity:", st, json.loads(b).get("username") if st == 200 else b[:200])
                  st, b = req("https://api.ebay.com/sell/account/v1/privilege", headers=H)
                  print("selling privileges:", st, "sellerRegistrationCompleted=%s" % json.loads(b).get("sellerRegistrationCompleted") if st == 200 else b[:200])
                  st, b = req("https://api.ebay.com/sell/fulfillment/v1/order?limit=1", headers=H)
                  print("orders total:", st, json.loads(b).get("total") if st == 200 else b[:200])
                  xml = ('<?xml version="1.0" encoding="utf-8"?><GetMyeBaySellingRequest xmlns="urn:ebay:apis:eBLBaseComponents">'
                         '<ActiveList><Include>true</Include><Pagination><EntriesPerPage>1</EntriesPerPage></Pagination></ActiveList>'
                         '<DetailLevel>ReturnSummary</DetailLevel></GetMyeBaySellingRequest>')
                  st, b = req("https://api.ebay.com/ws/api.dll", xml.encode(), {
                      "X-EBAY-API-IAF-TOKEN": tok, "X-EBAY-API-CALL-NAME": "GetMyeBaySelling",
                      "X-EBAY-API-SITEID": "0", "X-EBAY-API-COMPATIBILITY-LEVEL": "1193", "Content-Type": "text/xml"})
                  ack = re.search(r"<Ack>(\w+)</Ack>", b); n = re.search(r"<ActiveList>.*?<TotalNumberOfEntries>(\d+)", b, re.S)
                  print("active listings (Trading API):", st, ack and ack.group(1), n and n.group(1))
          except Exception as e:
              print("eBay error:", type(e).__name__, str(e)[:200])

          # ---------------- Amazon SP-API ----------------
          print("\n== Amazon SP-API ==")
          try:
              def bysuf(suf):
                  for k in sorted(S):
                      if "EBAY" not in k and k.endswith(suf): return k, S[k]
                  return None, None
              cn, cid = bysuf("CLIENT_ID") if not pick("SP_API_CLIENT_ID")[0] else pick("SP_API_CLIENT_ID")
              sn, csec = bysuf("CLIENT_SECRET")
              rn, rt = bysuf("REFRESH_TOKEN")
              _unused = pick("SP_API_CLIENT_ID", "SPAPI_CLIENT_ID", "AMAZON_CLIENT_ID", "AMAZON_LWA_CLIENT_ID", "LWA_CLIENT_ID", "AMAZON_SP_CLIENT_ID", "SP_API_LWA_CLIENT_ID")
              _u2 = pick("SP_API_CLIENT_SECRET", "SPAPI_CLIENT_SECRET", "AMAZON_CLIENT_SECRET", "AMAZON_LWA_CLIENT_SECRET", "LWA_CLIENT_SECRET", "AMAZON_SP_CLIENT_SECRET", "SP_API_LWA_CLIENT_SECRET")
              _u3 = pick("SP_API_REFRESH_TOKEN", "SPAPI_REFRESH_TOKEN", "AMAZON_REFRESH_TOKEN", "AMAZON_LWA_REFRESH_TOKEN", "LWA_REFRESH_TOKEN", "AMAZON_SP_REFRESH_TOKEN")
              print("using secrets:", cn, sn, rn)
              if not (cid and csec and rt):
                  print("Missing one of client id / client secret / refresh token")
              else:
                  st, body = req("https://api.amazon.com/auth/o2/token",
                      urllib.parse.urlencode({"grant_type": "refresh_token", "refresh_token": rt, "client_id": cid, "client_secret": csec}).encode(),
                      {"Content-Type": "application/x-www-form-urlencoded"})
                  j = json.loads(body); tok = j.get("access_token")
                  print("LWA token:", "OK" if tok else f"FAIL {st} {j.get('error')} {j.get('error_description')}")
                  if tok:
                      print(f"::add-mask::{tok}")
                      H = {"x-amz-access-token": tok, "user-agent": "AlphaDogStyles-probe/1.0"}
                      st, b = req("https://sellingpartnerapi-na.amazon.com/sellers/v1/marketplaceParticipations", headers=H)
                      if st == 200:
                          for p in json.loads(b).get("payload", []):
                              m, pa = p["marketplace"], p["participation"]
                              print(f"  {m['id']} {m['countryCode']} {m['name']}: participating={pa['isParticipating']} suspended={pa['hasSuspendedListings']}")
                      else:
                          print("marketplaceParticipations:", st, b[:300])
          except Exception as e:
              print("Amazon error:", type(e).__name__, str(e)[:200])
          PY
