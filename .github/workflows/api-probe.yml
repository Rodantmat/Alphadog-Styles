name: API probe (eBay + Amazon, read-only)

# Read-only access check. Prints only counts / marketplace names - never tokens,
# keys, emails or addresses (this repo is public, logs are public).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          AMAZON_APP_ID: ${{ secrets.AMAZON_APP_ID }}
