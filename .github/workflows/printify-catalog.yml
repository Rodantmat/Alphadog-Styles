name: printify-catalog
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: python3 scripts/printify_catalog.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out/catalog.json && git commit -m catalog && git pull -q --rebase && git push
