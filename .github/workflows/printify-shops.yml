name: printify-shops
on:
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: list
        env:
          T: ${{ secrets.PRINTIFY_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $T" https://api.printify.com/v1/shops.json | python3 -c "import sys,json;[print('SHOP',s['id'],s['title'],s['sales_channel']) for s in json.load(sys.stdin)]"
