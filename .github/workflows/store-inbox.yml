name: store-inbox
on:
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    env:
      ADM: ${{ secrets.STORE_ADMIN_TOKEN }}
    steps:
      - name: inbox
        run: |
          curl -s https://alphadog-store.rodolfoaamattos.workers.dev/api/internal/inbox -H "x-admin-token: $ADM" | python3 -m json.tool
