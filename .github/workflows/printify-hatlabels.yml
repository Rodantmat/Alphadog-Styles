name: printify-hatlabels
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: mkdir -p out && python3 scripts/printify_hatlabels.py
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out/hat_positions.json && git commit -m "hat positions" && git pull -q --rebase && git push
