name: site-qa-browsers
# Functional + visual QA of the live storefront with Playwright (Chromium).
# All /api/* calls except GET /api/health are intercepted and mocked in the browser: no orders, emails or requests reach the backend.
on:
  workflow_dispatch:
    inputs:
      base:
        default: "https://alphadogstyles.com"
permissions:
  contents: write
concurrency: site-qa-browsers
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [nav, shop, config, cart, art]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: pip install -q playwright==1.55.0 && python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run shard
        env:
          QA_BROWSER: ${{ matrix.browser }}
          QA_BASE: ${{ inputs.base || 'https://alphadogstyles.com' }}
          QA_OUT: out/site_qa
          QA_REPO: .
        run: rm -rf out/site_qa && python scripts/site_qa/${{ matrix.shard }}.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.browser }}-${{ matrix.shard }}
          path: out/site_qa
          retention-days: 7
  commit:
    needs: qa
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: _all
          pattern: qa-*
      - name: Merge per browser
        run: |
          for b in firefox webkit; do
            mkdir -p _q_$b
            for d in _all/qa-$b-*; do [ -d "$d" ] && cp -r "$d" "_q_$b/qa-${d##*qa-$b-}"; done
            [ -d "_q_$b" ] && python3 scripts/site_qa/merge.py _q_$b out/site_qa_$b || true
            rm -rf out/site_qa_$b/shots out/site_qa_$b/sheets
          done
      - name: Commit results
        run: |
          git config user.name "site-qa-bot"
          git config user.email "site-qa-bot@users.noreply.github.com"
          git add -A out/site_qa_firefox out/site_qa_webkit
          git commit -q -m "site-qa browsers: results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
