name: printify-colors
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: python3 scripts/printify_colors.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out/colors_all.json && git commit -m colors && git pull -q --rebase && git push
