name: printify-mockdeep
on:
  workflow_dispatch:
    inputs:
      prods:
        default: ""
      w:
        default: "600"
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
          P: ${{ inputs.prods }}
          W: ${{ inputs.w }}
        run: |
          IFS=',' read -ra A <<< "$P"
          python3 -u scripts/printify_mockdeep.py "${A[@]}" | tee out/mockdeep_log.txt
          git config user.name bot; git config user.email bot@x
          git add out/mockdeep out/mockdeep_log.txt
          git commit -m "mockdeep result" || true
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 3; done
