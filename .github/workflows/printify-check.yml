name: printify-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List Printify shops and products (read-only)
        env:
          T: ${{ secrets.PRINTIFY_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "SECRET_EMPTY"; exit 1; fi
          echo "== shops =="
          curl -s -H "Authorization: Bearer $T" https://api.printify.com/v1/shops.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([{k:s.get(k) for k in ('id','title','sales_channel')} for s in d] if isinstance(d,list) else d))"
          SID=$(curl -s -H "Authorization: Bearer $T" https://api.printify.com/v1/shops.json | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          echo "== products =="
          curl -s -H "Authorization: Bearer $T" "https://api.printify.com/v1/shops/$SID/products.json" | python3 -c "import sys,json; d=json.load(sys.stdin); print([(p['id'],p['title'],p.get('visible')) for p in d.get('data',[])])"
