name: printify-prodinfo
on: workflow_dispatch
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: python3 scripts/printify_prodinfo.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f out/prodinfo.json && git commit -qm prodinfo && git pull -q --rebase && git push -q
