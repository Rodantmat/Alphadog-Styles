name: printify-labelfix
on:
  workflow_dispatch:
    inputs:
      dry: {default: "1"}
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
          DRY: ${{ inputs.dry }}
        run: python3 scripts/printify_labelfix.py 2>&1 | tee out/labelfix.log
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f out/labelfix.log out/labelfix_result.json && git commit -qm "labelfix" ; for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 5; done
