name: picks2
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/video/picks.py 74,83 20
      - run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add out/scenery/pick && git commit -m "scenery picks 2" && git push || true
