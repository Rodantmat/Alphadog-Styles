name: mail-server
on:
  workflow_dispatch:
    inputs:
      mode: { default: "provision" }
      addr: { default: "" }
      cmd: { default: "" }
permissions:
  contents: write
concurrency: mail-server
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Provision / manage
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STORE_ADMIN_TOKEN: ${{ secrets.STORE_ADMIN_TOKEN }}
          MODE: ${{ inputs.mode }}
          ADDR: ${{ inputs.addr }}
          CMD: ${{ inputs.cmd }}
          MAILBOXES: "support,customization"
        run: python3 scripts/mail_provision.py
      - name: Commit encrypted state
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add mail || true
          git commit -m "mail server state" && git pull -q --rebase && git push || true
