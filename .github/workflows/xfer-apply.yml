name: xfer-apply (one time)
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          PRIV: ${{ secrets.AMZ_XFER_PRIV }}
        run: |
          set -e
          B=https://raw.githubusercontent.com/Rodantmat/melaleuca-cart/main/out
          curl -fsS $B/amz_xfer.key.enc -o k.enc; curl -fsS $B/amz_xfer.data.enc -o d.enc
          printf '%s\n' "$PRIV" > p.pem
          openssl pkeyutl -decrypt -inkey p.pem -pkeyopt rsa_padding_mode:oaep -in k.enc -out pass.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -in d.enc -out payload.txt -pass file:pass.txt
          get() { grep "^$1=" payload.txt | tail -1 | cut -d= -f2- | tr -d '\r'; }
          for k in CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do echo "::add-mask::$(get $k)"; done
          gh secret set AMZ_LWA_CLIENT_ID -R "${{ github.repository }}" --body "$(get CLIENT_ID)"
          gh secret set AMZ_LWA_CLIENT_SECRET -R "${{ github.repository }}" --body "$(get CLIENT_SECRET)"
          gh secret set AMZ_LWA_REFRESH_TOKEN -R "${{ github.repository }}" --body "$(get REFRESH_TOKEN)"
          rm -f p.pem pass.txt payload.txt k.enc d.enc
          echo "secrets updated"
