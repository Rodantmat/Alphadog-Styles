name: printify-inspect
on:
  workflow_dispatch:
    inputs:
      args: {description: "SHOP PID...", required: true}
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: python3 scripts/printify_inspect.py ${{ github.event.inputs.args }} | tee out_log.txt
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f out/pinspect && git commit -qm "pinspect" && git pull -q --rebase && git push -q
