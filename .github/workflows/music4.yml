name: music4
on: { workflow_dispatch: { inputs: { target: { default: "300" } } } }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q ffmpeg && pip install -q librosa numpy
      - run: python3 scripts/video/music4.py ${{ inputs.target }}
      - run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add out/music2 && git commit -m "music4: library to ${{ inputs.target }} themed tracks" && git pull --rebase -q && git push || true
