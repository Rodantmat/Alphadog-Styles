name: printful-brazil
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/printful_brazil.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out/printful_brazil.json && git commit -m "printful brazil check" && git pull -q --rebase && git push
