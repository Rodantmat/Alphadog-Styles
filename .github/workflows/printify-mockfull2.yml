name: printify-mockfull2
on:
  workflow_dispatch:
    inputs:
      prods:
        description: product names comma sep (blank = all)
        default: ""
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
          P: ${{ inputs.prods }}
        run: |
          IFS=',' read -ra A <<< "$P"
          python3 -u scripts/printify_mockfull2.py "${A[@]}" | tee out/mockfull_log.txt
          git config user.name bot; git config user.email bot@x
          git add out/mockfull out/mockfull_log.txt
          git commit -m "mockfull result" || true
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 3; done
