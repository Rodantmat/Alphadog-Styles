name: picks
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/video/picks.py 54,28,77,110,29,57,108,116,155,17
      - run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add out/scenery/pick && git commit -m "scenery picks" && git push || true
