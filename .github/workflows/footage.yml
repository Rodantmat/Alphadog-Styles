name: footage
on:
  workflow_dispatch:
    inputs: { mode: {default: list}, ids: {default: ''} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: python3 scripts/video/footage.py "${{ inputs.mode }}" "${{ inputs.ids }}"
      - run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add out/footage && git commit -m "footage" && git pull --rebase -q && git push || true
