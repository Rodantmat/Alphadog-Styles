name: printify-extras
on:
  workflow_dispatch:
    inputs:
      mode: { default: "build" }
      extra: { default: "7" }
permissions:
  contents: write
concurrency: printify-extras
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
          MODE: ${{ inputs.mode }}
          EXTRA: ${{ inputs.extra }}
          SHOP: "29546485"
          CHANNEL: tiktok
        run: python3 scripts/printify_extras.py
      - name: Commit state
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A out || true
          git commit -m "extras state" && git pull -q --rebase && git push || true
