name: printify-brandtest
on:
  workflow_dispatch:
    inputs:
      mode: { default: "cap" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: mkdir -p out && MODE=${{ inputs.mode }} python3 scripts/printify_brandtest.py
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out/brandtest out/brand_v2_ids.json shop/brand 2>/dev/null; git commit -m brandtest && git pull -q --rebase && git push
