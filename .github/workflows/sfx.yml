name: sfx
on: workflow_dispatch
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/video/sfx.py
      - run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add out/sfx && git commit -m "sfx" && git pull --rebase -q && git push || true
