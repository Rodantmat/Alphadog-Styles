name: printify-probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: python3 scripts/printify_probe.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out/probe.json && git commit -m probe && git pull -q --rebase && git push
