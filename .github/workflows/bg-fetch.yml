name: bg-fetch
on:
  workflow_dispatch:
    inputs:
      hdri: {description: "number of HDRI scenes", default: "120"}
      tex: {description: "number of textures", default: "80"}
      views: {description: "views per HDRI", default: "2"}
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy pillow opencv-python-headless
      - run: python3 scripts/bgfetch.py out/bgphotos ${{ inputs.hdri }} ${{ inputs.tex }} ${{ inputs.views }} 2>&1 | tee bg_log.txt
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          cd out/bgphotos; n=0; ls *.jpg | split -l 60 - part_; for p in part_*; do n=$((n+1)); zip -q -@ ../../bgp_$n.zip < $p; done; cp catalog.json ../../bg_catalog.json; cd ../..
          gh release delete bgphotos -y --cleanup-tag || true
          gh release create bgphotos bgp_*.zip bg_catalog.json bg_log.txt --title bgphotos --notes "Poly Haven CC0 real-photo backgrounds"
