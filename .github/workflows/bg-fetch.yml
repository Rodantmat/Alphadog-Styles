name: bg-fetch
on:
  workflow_dispatch:
    inputs:
      views: {description: "views per HDRI", default: "4"}
      hdri: {description: "max HDRIs (997 = all)", default: "997"}
      tex: {description: "max Poly Haven textures", default: "869"}
      amb: {description: "ambientCG materials", default: "300"}
      shards: {description: "shards", default: "8"}
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy pillow opencv-python-headless
      - run: python3 scripts/bgfetch.py out/bg ${{ matrix.shard }} ${{ inputs.shards }} ${{ inputs.views }} ${{ inputs.hdri }} ${{ inputs.tex }} ${{ inputs.amb }} 2>&1 | tee bg_log_${{ matrix.shard }}.txt
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          cd out/bg; ls *.jpg | split -l 70 - part_; n=0; for p in part_*; do n=$((n+1)); zip -q -@ ../../bgp_s${{ matrix.shard }}_$n.zip < $p; done; cd ../..
          T=bgphotos_s${{ matrix.shard }}
          gh release delete $T -y --cleanup-tag || true
          gh release create $T bgp_s*.zip out/bg/catalog_${{ matrix.shard }}.json bg_log_${{ matrix.shard }}.txt --title $T --notes "CC0 real-photo backgrounds shard ${{ matrix.shard }}"
