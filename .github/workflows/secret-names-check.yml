name: secret-names-check
on: { workflow_dispatch: {} }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - env:
          A: ${{ secrets.AMZ_CLIENT }}
          B: ${{ secrets.AMZ_SECRET }}
          C: ${{ secrets.CREDENTIALS_ENV }}
          D: ${{ secrets.STORE_ADMIN_TOKEN }}
          E: ${{ secrets.AMZ_REFRESH_TOKEN }}
        run: |
          for v in A:AMZ_CLIENT B:AMZ_SECRET C:CREDENTIALS_ENV D:STORE_ADMIN_TOKEN E:AMZ_REFRESH_TOKEN; do k=${v%%:*}; n=${v##*:}; [ -n "${!k}" ] && echo "$n: set" || echo "$n: empty"; done
