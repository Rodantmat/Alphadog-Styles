name: person-probe
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pillow
      - run: python3 scripts/person_probe.py | tee probe.txt
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out/person_probe.png && git commit -qm "person probe sheet" && git pull -q --rebase && git push
