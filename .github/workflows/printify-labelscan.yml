name: printify-labelscan
on: {workflow_dispatch: {}}
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: python3 scripts/printify_labelscan.py 2>&1 | tee out/labelscan.log
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f out/labelscan out/labelscan.log && git commit -qm "labelscan" ; for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 5; done
