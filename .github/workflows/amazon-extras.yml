name: amazon-extras
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pillow numpy cairosvg
      - run: python3 scripts/market_plan.py | tail -1
      - run: python3 scripts/amazon_extras.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add store/data/amazon_extras.json out/amazon_pilot_sheet.png && git commit -qm "amazon pilot extras" && git pull -q --rebase && git push
