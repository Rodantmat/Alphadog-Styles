name: printify-hatlogo
on:
  workflow_dispatch:
    inputs:
      dry: {default: "1"}
      limit: {default: "100000"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
          DRY: ${{ inputs.dry }}
          LIMIT: ${{ inputs.limit }}
        run: mkdir -p out && python3 scripts/printify_hatlogo.py
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out/hatlogo_result.json && git commit -m "hat logo" && git pull -q --rebase && git push
