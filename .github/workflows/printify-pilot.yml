name: printify-pilot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create pilot DRAFT product (unpublished)
        env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: |
          mkdir -p out
          python3 scripts/printify_pilot.py 2>&1 | tee out/printify_pilot.txt
      - name: Commit result
        if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out/printify_pilot.txt out/pilot_mockups 2>/dev/null; git commit -m "printify pilot result" && git pull -q --rebase && git push
