name: tiktok-darknew
on:
  workflow_dispatch:
    inputs:
      mode: { description: "create|swap", required: true, default: "create" }
      n: { description: "slots to swap", required: false, default: "1" }
      start: { description: "start index", required: false, default: "0" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
          MODE: ${{ inputs.mode }}
          N: ${{ inputs.n }}
          START: ${{ inputs.start }}
        run: python3 scripts/tiktok_darknew.py
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f out/state_dark_tiktok.json 2>/dev/null || true
          git commit -qm "dark tiktok state" && git pull -q --rebase && git push -q || true
