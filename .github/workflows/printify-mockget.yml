name: printify-mockget
on: workflow_dispatch
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/printify_mockget.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f out/mockget && git commit -qm "mockget" && git pull -q --rebase && git push -q
