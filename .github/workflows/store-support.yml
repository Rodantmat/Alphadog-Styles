name: store-support
# Used by the scheduled support assistant: list new support/custom emails, look up orders, send replies, mark handled.
on:
  workflow_dispatch:
    inputs:
      action: { description: "list | orders | reply | done | custom", default: "list" }
      payload: { description: "JSON payload", default: "{}" }
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ADM: ${{ secrets.STORE_ADMIN_TOKEN }}
      U: "https://alphadogstyles.com"
      ACTION: ${{ inputs.action }}
      PAYLOAD: ${{ inputs.payload }}
    steps:
      - name: Run
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse
          U=os.environ["U"]; H={"x-admin-token":os.environ["ADM"],"content-type":"application/json","User-Agent":"a"}; A=os.environ["ACTION"]; P=json.loads(os.environ.get("PAYLOAD") or "{}")
          def call(m,p,b=None): return json.load(urllib.request.urlopen(urllib.request.Request(U+p,data=json.dumps(b).encode() if b is not None else None,method=m,headers=H),timeout=60))
          if A=="list": out=call("GET","/api/internal/support?status="+P.get("status","new"))
          elif A=="orders": out=call("GET","/api/internal/orders?email="+urllib.parse.quote(P["email"])) if "@" in P.get("email","") else call("GET","/api/internal/orders?status="+P.get("status","paid"))
          elif A=="custom": out=call("GET","/api/internal/custom"+("?status="+P["status"] if P.get("status") else ""))
          elif A=="reply":
              out=call("POST","/api/internal/send",{"to":P["to"],"subject":P["subject"],"html":P["html"],"mailbox":P.get("mailbox","support")})
              if P.get("id"): call("POST",f"/api/internal/support/{P['id']}",{"status":"handled","reply":P["html"][:4000]})
          elif A=="done": out=call("POST",f"/api/internal/support/{P['id']}",{"status":P.get("status","handled")})
          else: out={"error":"unknown action"}
          print("RESULT_JSON_START"); print(json.dumps(out,indent=1)[:60000]); print("RESULT_JSON_END")
          PY
