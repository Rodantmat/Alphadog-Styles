name: ebay-republish
on:
  workflow_dispatch:
    inputs:
      n: { default: "3" }
      wait: { default: "300" }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
          N: ${{ inputs.n }}
          WAIT: ${{ inputs.wait }}
        run: python3 scripts/ebay_republish.py
