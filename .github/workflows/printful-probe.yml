name: printful-probe
on:
  workflow_dispatch:
    inputs:
      task:
        description: "basic"
        required: true
        default: basic
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRINTFUL_API_TOKEN: ${{ secrets.PRINTFUL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/brazil/printful_probe.py
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "printful-probe"
          git config user.email "probe@users.noreply.github.com"
          git add docs/brazil_data/printful
          git commit -m "printful probe data" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 3; done
