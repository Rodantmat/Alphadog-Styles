name: xfer-keygen (one time)
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          set -e
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out k.pem 2>/dev/null
          gh secret set AMZ_XFER_PRIV --repo "${{ github.repository }}" < k.pem
          openssl pkey -in k.pem -pubout > xfer_pub.pem
          mkdir -p out && cp xfer_pub.pem out/amz_xfer_pub.pem
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add out/amz_xfer_pub.pem; git commit -qm "amazon transfer public key"; git pull -q --rebase; git push -q
          echo done
    permissions: { contents: write }
