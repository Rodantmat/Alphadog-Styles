name: nb-run
# Generic runner for the new-Brazil-breeds art pipeline (generation, eye detection, review). Commits out/nb2/.
on:
  workflow_dispatch:
    inputs:
      script: {description: "script path", default: "scripts/nb_gen.py"}
      args: {description: "args", default: ""}
permissions:
  contents: write
concurrency:
  group: nb-run-${{ inputs.args }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow numpy opencv-python-headless scipy
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 ${{ inputs.script }} ${{ inputs.args }}
      - name: Commit
        if: always()
        run: |
          git config user.name "alphadog-bot"
          git config user.email "alphadog-bot@users.noreply.github.com"
          git add out/nb2 || true
          git commit -m "nb2 run ${{ inputs.args }} $(date -u +%F_%H%M)" || echo none
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 6; done
