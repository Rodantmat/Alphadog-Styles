name: photos
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/video/photos.py
      - run: |
          git config user.name "alphadog-bot"; git config user.email "bot@users.noreply.github.com"
          git add out/photos && git commit -m "photos" && git pull --rebase -q && git push || true
