name: secrets-check
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_KEY: ${{ secrets.ETSY_KEY }}
          ETSY_CLIENT_ID: ${{ secrets.ETSY_CLIENT_ID }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SECRET: ${{ secrets.ETSY_SECRET }}
          ETSY_API_SECRET: ${{ secrets.ETSY_API_SECRET }}
          ETSY_APP_KEY: ${{ secrets.ETSY_APP_KEY }}
          ETSY_TOKEN: ${{ secrets.ETSY_TOKEN }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_TOKEN: ${{ secrets.EBAY_TOKEN }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
          TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: |
          for n in ETSY_API_KEY ETSY_KEYSTRING ETSY_KEY ETSY_CLIENT_ID ETSY_SHARED_SECRET ETSY_SECRET ETSY_API_SECRET ETSY_APP_KEY ETSY_TOKEN ETSY_ACCESS_TOKEN ETSY_REFRESH_TOKEN EBAY_APP_ID EBAY_CLIENT_ID EBAY_CERT_ID EBAY_CLIENT_SECRET EBAY_DEV_ID EBAY_TOKEN EBAY_USER_TOKEN EBAY_REFRESH_TOKEN TIKTOK_APP_KEY TIKTOK_APP_SECRET TIKTOK_ACCESS_TOKEN PRINTIFY_TOKEN; do v="${!n}"; echo "$n ${#v}"; done
