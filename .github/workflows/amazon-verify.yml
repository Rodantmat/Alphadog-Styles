name: amazon-verify
on: { workflow_dispatch: { inputs: { ldc: { default: "4" } } } }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pillow numpy cairosvg scipy
      - run: python3 scripts/market_plan.py | tail -1
      - run: python3 scripts/amazon_mains.py | head -3
      - run: DCS=${{ inputs.ldc }} python3 scripts/amazon_gallery.py
      - run: LDC=${{ inputs.ldc }} python3 scripts/amazon_verify.py | tee verify.txt
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f out/verify* && git commit -qm "pilot verify sheets" && git pull -q --rebase --autostash && git push
