name: store-deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'
  push:
    paths: ["store/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Cloudflare secrets not set yet - skipping deploy"; echo "SKIP=1" >> $GITHUB_ENV; fi
      - name: Create database and deploy
        if: env.SKIP != '1'
        working-directory: store/worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_TOKEN: ${{ secrets.STORE_ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          MAIL_FROM_ADDR: ${{ vars.MAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          set -e
          npm install --silent
          DATABASE_URL=$(printf '%s' "$DATABASE_URL" | tr -d '[:space:]'); export DATABASE_URL
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret is missing"; exit 1; fi
          [ -n "$MAIL_FROM_ADDR" ] && sed -i "s|^MAIL_FROM = .*|MAIL_FROM = \"$MAIL_FROM_ADDR\"|" wrangler.toml || true
          # DATABASE_URL = admin string from DigitalOcean. Create the separate store database, then point the Worker at it.
          psql "$DATABASE_URL" -tAc "SELECT 1 FROM pg_database WHERE datname='alphadog_store'" | grep -q 1 || psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE alphadog_store"
          DATABASE_URL=$(python3 -c "import os,urllib.parse as u;p=u.urlsplit(os.environ['DATABASE_URL']);print(u.urlunsplit(p._replace(path='/alphadog_store')))")
          export DATABASE_URL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql
          # Workers cannot verify DigitalOcean's private CA directly; route through Cloudflare Hyperdrive (custom CA, caching off).
          HDR=$(python3 ../../scripts/hyperdrive_setup.py | tail -1); echo "$HDR" | sed 's/HYPERDRIVE_ID=\(....\).*/HYPERDRIVE_ID=\1.../'
          case "$HDR" in HYPERDRIVE_ID=*) printf '\n[[hyperdrive]]\nbinding = "HYPERDRIVE"\nid = "%s"\n' "${HDR#HYPERDRIVE_ID=}" >> wrangler.toml ;; esac
          npx wrangler@4 deploy
          for v in DATABASE_URL ADMIN_TOKEN STRIPE_SECRET_KEY RESEND_API_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET FACEBOOK_APP_ID FACEBOOK_APP_SECRET APPLE_CLIENT_ID APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY; do
            val=$(printf '%s' "${!v}" | tr -d '\r\n'); if [ -n "$val" ]; then printf '%s' "$val" | npx wrangler@4 secret put $v; fi
          done
          # Stripe webhook: create once for this URL (secret is only returned at creation), store it as a Worker secret.
          SK=$(printf '%s' "$STRIPE_SECRET_KEY" | tr -d '[:space:]')
          if [ -n "$SK" ]; then
            WH="https://alphadog-store.rodolfoaamattos.workers.dev/api/stripe/webhook"
            if ! curl -s -u "$SK:" "https://api.stripe.com/v1/webhook_endpoints?limit=100" | grep -q "$WH"; then
              RES=$(curl -s -u "$SK:" https://api.stripe.com/v1/webhook_endpoints -d url="$WH" -d "enabled_events[]=checkout.session.completed" -d "enabled_events[]=checkout.session.async_payment_succeeded")
              WS=$(printf '%s' "$RES" | python3 -c "import sys,json;print(json.load(sys.stdin).get('secret',''))")
              if [ -n "$WS" ]; then printf '%s' "$WS" | npx wrangler@4 secret put STRIPE_WEBHOOK_SECRET; echo "webhook created"; else echo "webhook create failed"; fi
            else echo "webhook exists"; fi
          fi
          npx wrangler@4 deployments list | tail -5
