name: printify-darkblanks
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: python3 scripts/printify_darkblanks.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add out/blanks_dark && git commit -m darkblanks && git pull -q --rebase && git push
